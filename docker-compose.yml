services:
  postgres:
    image: postgres:16
    container_name: real_estate_lisbon_db

    restart: always

    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate_password
      POSTGRES_DB: realestate_lisbon

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: